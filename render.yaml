services:
  - type: web
    name: token-gate-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    # Render exposes the PORT env var; main.py already reads it (default 5000).
    # The public URL is available as RENDER_EXTERNAL_URL, which main.py uses
    # to build the /verify WebApp URL when WALLET_CONNECT_URL is not set.
    envVars:
      # ── Required ───────────────────────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # Set this secret in the Render dashboard
      - key: DATABASE_URL
        sync: false          # Set this secret in the Render dashboard
      # ── Optional / recommended ─────────────────────────────────────────────
      - key: WALLET_CONNECT_URL
        value: ""
      - key: WALLET_CONNECT_ALLOWED_HOSTS
        value: alphacity.tech,www.alphacity.tech
      # RENDER_EXTERNAL_URL is injected automatically by Render.
      # PUBLIC_WEBAPP_BASE_URL is only needed if you want to override it.
      - key: PUBLIC_WEBAPP_BASE_URL
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        value: https://alphacity.tech,https://www.alphacity.tech
      # Supply one or more production GraphQL providers, separated by commas.
      # The code falls back to Mysten's rate-limited public endpoint for dev.
      - key: SUI_GRAPHQL_URLS
        sync: false
      # Optional: use Telegram webhooks instead of the lease-protected poller.
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Database connection pool size (tune to your Render plan).
      - key: DB_POOL_MIN
        value: "2"
      - key: DB_POOL_MAX
        value: "10"
      - key: SUI_FETCH_WORKERS
        value: "8"
      - key: SUI_OPERATION_TIMEOUT_SECONDS
        value: "90"
      - key: SUI_MAX_PAGES
        value: "200"
      - key: SUI_MAX_OBJECTS
        value: "10000"
      - key: WALLET_CHECK_INTERVAL_SECONDS
        value: "172800"
      - key: AUTO_REMOVE_GRACE_SECONDS
        value: "86400"
      - key: VERIFY_SESSION_MAX_ATTEMPTS
        value: "10"
      # Optional: enables the bearer-protected /metrics endpoint.
      - key: METRICS_TOKEN
        sync: false
