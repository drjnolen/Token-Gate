name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pip-audit==2.10.1 ruff==0.12.12
      - run: python -m compileall -q main.py verification_security.py enforcement_policy.py sui_gateway.py runtime_support.py tests
      - run: node --check static/verify.js
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip check
      - run: pip-audit -r requirements.txt
